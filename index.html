<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timsales | Wood Products Manufacturer, Kenya</title>
    <meta name="description" content="Timsales manufactures plywood, fibreboards, chipboards, block boards, doors, timber, transmission poles and prefabricated buildings in Elburgon, Kenya." />
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />

  <body>
    <!-- Netlify Forms detection: static copy of the React contact form (kept hidden) -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="company" />
      <input name="email" />
      <input name="phone" />
      <input name="country" />
      <input name="product" />
      <input name="quantity" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
